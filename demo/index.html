<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inverted Pendulum — Interactive Demo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="title-block">
      <h1 data-i18n="title">Inverted Pendulum</h1>
      <p data-i18n="instructions">Click the track to set target. Drag the pendulum to disturb it.</p>
    </div>
    <div class="lang-select" id="lang-select">
      <button class="lang-btn" id="lang-toggle" aria-expanded="false" aria-haspopup="true">
        <span class="lang-flag" id="lang-flag">&#127468;&#127463;</span>
        <span id="lang-label">English</span>
        <span class="arrow">&#9660;</span>
      </button>
      <div class="lang-menu">
        <button class="lang-option active" data-lang="en" id="opt-en"><span class="lang-flag">&#127468;&#127463;</span> English</button>
        <button class="lang-option" data-lang="de" id="opt-de"><span class="lang-flag">&#127465;&#127466;</span> Deutsch</button>
        <button class="lang-option" data-lang="ru" id="opt-ru"><span class="lang-flag">&#127479;&#127482;</span> Русский</button>
      </div>
    </div>
  </header>

  <div class="canvas-wrap">
    <canvas id="canvas" width="960" height="400"></canvas>
  </div>

  <div class="graph-wrap">
    <canvas id="graph-canvas"></canvas>
  </div>

  <div class="status-bar">
    <span class="status-dot-wrap">
      <span class="indicator st-stable" id="status-dot"></span>
      <span class="status-label" id="status-text">Stable</span>
    </span>
    <span>x<sub>c</sub>: <span class="val" id="val-xc">0.00</span> m</span>
    <span>&theta;: <span class="val" id="val-theta">0.0</span>&deg;</span>
    <span><span data-i18n="target">Target</span>: <span class="val" id="val-target">0.00</span> m</span>
    <span>F: <span class="val" id="val-force">0.0</span> N</span>
    <div class="status-actions">
      <button id="btn-reset" data-i18n-title="reset" title="Reset" aria-label="Reset">&#x1F504;</button>
      <button id="btn-pause" data-i18n-title="pause" title="Pause" aria-label="Pause">&#x23F8;&#xFE0F;</button>
      <button id="btn-disturb" data-i18n-title="disturb" title="Disturb" aria-label="Disturb">&#x1F4A5;</button>
    </div>
  </div>

  <div class="controls">
    <div class="panel presets">
      <h3 data-i18n="presets">Presets</h3>
      <div class="preset-row">
        <button data-preset="stabilization" class="active">
          <span data-i18n="pr_stab">Stabilization</span>
          <span class="preset-tip" data-i18n="tip_stab">Balanced gains for keeping the pendulum upright</span>
        </button>
        <button data-preset="tracking">
          <span data-i18n="pr_track">Position Tracking</span>
          <span class="preset-tip" data-i18n="tip_track">Stronger cart PID for faster target tracking</span>
        </button>
        <button data-preset="conservative">
          <span data-i18n="pr_cons">Conservative</span>
          <span class="preset-tip" data-i18n="tip_cons">Gentle gains, slow but very smooth response</span>
        </button>
        <button data-preset="off">
          <span data-i18n="pr_off">PID Off</span>
          <span class="preset-tip" data-i18n="tip_off">No control &mdash; the pendulum falls freely</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <h3 data-i18n="anglePid">Angle PID</h3>
      <div class="slider-row"><label>Kp</label><input type="range" id="s-tkp" min="0" max="300" step="1" value="150"><span class="slider-val" id="v-tkp">150</span></div>
      <div class="slider-row"><label>Ki</label><input type="range" id="s-tki" min="0" max="5" step="0.05" value="0.5"><span class="slider-val" id="v-tki">0.50</span></div>
      <div class="slider-row"><label>Kd</label><input type="range" id="s-tkd" min="0" max="40" step="0.5" value="15"><span class="slider-val" id="v-tkd">15.0</span></div>
    </div>

    <div class="panel">
      <h3 data-i18n="cartPid">Cart PID</h3>
      <div class="slider-row"><label>Kp</label><input type="range" id="s-ckp" min="-30" max="0" step="0.5" value="-10"><span class="slider-val" id="v-ckp">-10.0</span></div>
      <div class="slider-row"><label>Ki</label><input type="range" id="s-cki" min="-2" max="0" step="0.01" value="-0.30"><span class="slider-val" id="v-cki">-0.30</span></div>
      <div class="slider-row"><label>Kd</label><input type="range" id="s-ckd" min="-20" max="0" step="0.5" value="-8"><span class="slider-val" id="v-ckd">-8.0</span></div>
    </div>
  </div>

  <details>
    <summary data-i18n="howTitle">How it works</summary>
    <p data-i18n="howText1"></p>
    <p data-i18n="howText2"></p>
  </details>

</div>

<footer>
  <p>&copy; 2026 <a href="https://github.com/tuman-area/inverted-pendulum-stabilization">Alexey Bulgakov</a></p>
</footer>

<div class="achievement" id="achievement" aria-live="polite">
  <span class="achievement-header" data-i18n="achHeader">Achievement unlocked</span>
  <span class="achievement-title" id="achievement-title"></span>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
